services:
  # 1. Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - saas-network

  # 2. Frontend - Next.js
  # 2. Frontend - Next.js
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    volumes:
      - ./frontend:/app
    environment:
      - NODE_ENV=development
    networks:
      - saas-network

  # 3. Backend - Laravel (PHP-FPM)
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - mysql
      - redis
    networks:
      - saas-network

  # 4. Database - MySQL
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ole_saas
      MYSQL_ROOT_PASSWORD: OleYasha_020
      MYSQL_USER: saas_ole
      MYSQL_PASSWORD: OleYasha_020
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - saas-network

  # 5. Cache & Queue - Redis
  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  db-data:
  redis-data: